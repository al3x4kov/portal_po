<!-- Экран: Новый проект. Состояние: ввод имени + валидация. Покрывает FR-2. -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый проект</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../tokens.css">
</head>
<body class="min-h-screen">
<div class="max-w-lg mx-auto px-4 py-10">
  <a href="start.html" class="btn btn-ghost mb-6">← Назад</a>
  <div class="card p-7">
    <h2 class="text-xl font-bold mb-1">Новый проект</h2>
    <p class="t2 text-sm mb-6">Будет создан каталог в <span class="mono text-xs">Projects/</span>. Если каталог Projects/ отсутствует — он будет воссоздан автоматически.</p>

    <label class="label" for="pname">Имя проекта</label>
    <input id="pname" class="input" value="payments-platform" aria-describedby="hint">
    <p id="hint" class="text-xs t3 mt-2">Будет создан путь: <span class="mono">Projects/payments-platform</span></p>

    <div class="badge mt-4" style="background:var(--color-success-bg);color:var(--color-success)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      Имя свободно
    </div>

    <!-- Состояние ошибки (показано для примера) -->
    <div class="mt-3 p-3 rounded-lg text-sm flex gap-2" style="background:var(--color-danger-bg);color:var(--color-danger)">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span>Каталог с таким именем уже есть в Projects/. Выберите другое имя.</span>
    </div>

    <div class="flex justify-end gap-3 mt-7">
      <a href="start.html" class="btn btn-secondary">Отменить</a>
      <a href="main.html" class="btn btn-primary">Создать проект</a>
    </div>
  </div>
</div>
</body>
</html>
